name: Greyway.Co - Build Institutional Artifacts

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-all:
    name: Build Multi-Platform Artifacts
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java (For Android)
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install Linux Dependencies
      - name: 🐧 Install Linux Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      # 5. Get Dependencies
      - name: 📦 Flutter Pub Get
        run: flutter pub get

      # --- BUILD WEB (Portable - Works from Any Root) ---
      - name: 🌐 Build Portable Web Portal
        run: |
          flutter build web --release --base-href / \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=POWERSYNC_ENDPOINT_URL=${{ secrets.POWERSYNC_ENDPOINT_URL }}

      - name: 📦 Compress Web Build
        run: tar -czvf greyway-web-build.tar.gz -C build/web .

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: greyway-web-portal
          path: greyway-web-build.tar.gz

      - name: 📄 Upload Web to Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # --- BUILD ANDROID ---
      - name: 📱 Build Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=POWERSYNC_ENDPOINT_URL=${{ secrets.POWERSYNC_ENDPOINT_URL }}

      - name: 📤 Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: greyway-android-release
          path: build/app/outputs/flutter-apk/app-release.apk

      # --- BUILD LINUX ---
      - name: 🖥️ Build Linux Executable
        run: |
          flutter build linux --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=POWERSYNC_ENDPOINT_URL=${{ secrets.POWERSYNC_ENDPOINT_URL }}

      - name: 📦 Compress Linux Build
        run: tar -czvf greyway-linux-release.tar.gz -C build/linux/x64/release bundle/

      - name: 📤 Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: greyway-linux-release
          path: greyway-linux-release.tar.gz

  deploy-pages:
    # Only deploy on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-all
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
